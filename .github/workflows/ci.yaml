name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  # 静的チェック
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Python のチェック
      - name: Run Ruff
        run: |
          pip install ruff
          ruff check .
          ruff format --check .

      # React (TypeScript) のチェック
      - name: Run ESLint
        working-directory: ./frontend
        run: |
          corepack enable
          pnpm install
          pnpm run lint

  # テスト実行
  test:
    needs: lint-and-format # 左記をpassしたら実行
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 環境変数ファイルを生成
      - name: Create .env files
        run: |
          cp backend/.env.example backend/.env
          cp .env.example .env

      # Python のテスト実行
      - name: Run Pytest
        run: docker compose -f compose.dev.yaml run --rm backend pytest