name: CD (Deploy to EC2)

# 一時的に自動デプロイをOFF
# on:
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: deployer
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # アプリのディレクトリに移動
            cd /var/www/churn-prediction-app
            
            # 最新のコードを取得
            git pull origin main
            
            # Dockerイメージのビルドとコンテナの再起動
            # バックグラウンドでビルドし、コンテナを入れ替え
            # 変更がないコンテナも、強制的に新しく作り直して起動する
            docker compose -f compose.prd.yaml up -d --build --force-recreate
            
            # 古いイメージを削除
            docker image prune -f

      # APIを叩いて、200が返ってくるか確認
      - name: Run Smoke Test
        shell: bash
        env:
          API_VERSION: v2
        run: |
          # 失敗しても5秒間隔でリトライ（最大10回）
          for i in {1..10}; do
            echo "Attempt $i: Checking health..."
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.PRD_IP }}:8000/api/${API_VERSION}/health/db || true)
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "Server is ready!"
              exit 0 # 200なら成功して終了
            fi
            echo "Status $STATUS_CODE, retrying in 5 seconds..."
            sleep 5
          done
          
          # 10回失敗
          echo "Server failed to start after 10 attempts."
          exit 1
