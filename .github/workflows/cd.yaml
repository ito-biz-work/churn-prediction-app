name: CD (Deploy to EC2)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: deployer
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # アプリのディレクトリに移動
            cd /var/www/churn-prediction-app
            
            # 最新のコードを取得
            git pull origin main
            
            # Dockerイメージのビルドとコンテナの再起動
            # バックグラウンドでビルドし、コンテナを入れ替え
            # 変更がないコンテナも、強制的に新しく作り直して起動する
            docker compose -f compose.prd.yaml up -d --build --force-recreate
            
            # 古いイメージを削除
            docker image prune -f

      # コンテナが完全に立ち上がるまで10秒待つ
      - name: Wait for containers to start
        run: sleep 10

      # APIを叩いて、200が返ってくるか確認
      - name: Run Smoke Test
        shell: bash
        run: |
          # 1回失敗しても5秒間隔でリトライ（最大10回）
          # for i in {1..10}; do
          #   STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.PRD_IP }}/api/v1/health)
          #   if [ "$STATUS_CODE" -eq 200 ]; then
          #     exit 0
          #   fi
          #   sleep 5
          # done
          # exit 1

          # IP部分だけを確認（IPそのものは出さない）
          echo "Connecting to target..."
          
          # 成功したかどうかの判定用
          RESPONSE=$(curl -I -s http://${{ secrets.PRD_IP }}/api/v1/health)
          echo "Response Headers:"
          echo "$RESPONSE"
          
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.PRD_IP }}/api/v1/health)
          echo "Status Code: $STATUS_CODE"
          
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Health check failed!"
            exit 1
          fi