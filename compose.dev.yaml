# --- 開発用

# 共通のログ設定
x-logging-base: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"  # 10MBでローテーション
      max-file: "3"    # 過去3世代分まで

services:
  backend:
    image: churn-app-back:v2.0-dev
    container_name: back-v2.0-dev
    build: 
      context: .
      dockerfile: ./backend/Dockerfile.dev
    ports:
      - "8000:8000"
    <<: *default-logging
    volumes: 
      - .:/app # コードの同期
      - /app/backend/.venv # 念のため保護
    depends_on:
      - db
      - db-test
    environment:
      - "DATABASE_URL=postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
    env_file:
      - ./backend/.env
  
  frontend:
    image: churn-app-front:v2.0-dev
    container_name: front-v2.0-dev
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    ports:
      - "5173:5173" # Vite
    <<: *default-logging
    volumes:
      - ./frontend:/frontend # # コードの同期
      - /frontend/node_modules # コンテナ側のnode_modulesを保護
    env_file:
      - ./frontend/.env

  db:
    image: postgres:18.4
    container_name: db-v2.0-dev
    ports:
      - "5432:5432"
    <<: *default-logging
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

  db-test:
    image: postgres:18.4
    container_name: db-v2.0-test
    ports:
      - "5433:5432" # 衝突を防ぐため、ホスト側のポートをずらす
    <<: *default-logging
    volumes:
      - postgres_data_test:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}_test # 「_test」を付けて区別

volumes:
  postgres_data_dev:
    name: churn_postgres_data_dev

  postgres_data_test:
    name: churn_postgres_data_test