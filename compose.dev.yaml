# --- 開発用
services:
  backend:
    image: churn-app-back:v1.0-dev
    container_name: back-v1.0-dev
    build: 
      context: .
      dockerfile: backend/Dockerfile.dev
    ports: ["8000:8000"]
    volumes: 
      - .:/app # コードの同期
      - /app/backend/.venv # 念のため保護
    environment:
      - DATABASE_URL=sqlite:////app/data/churn.db # コンテナ内でのパスを指定
  
  frontend:
    image: churn-app-front:v1.0-dev
    container_name: front-v1.0-dev
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    ports: ["5173:5173"] # Vite
    volumes:
      - ./frontend:/frontend # # コードの同期
      - /frontend/node_modules # コンテナ側のnode_modulesを保護